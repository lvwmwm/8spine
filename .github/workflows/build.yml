name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bundle
        run: node scripts/build.js

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/spine.js

      - name: Commit bundle
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/spine.js
          if git diff --cached --quiet; then
            echo "dist unchanged"
          else
            git commit -m "build: dist/spine.js"
            git push
          fi